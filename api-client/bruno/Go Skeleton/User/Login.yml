info:
  name: Login
  type: http
  seq: 1

http:
  method: POST
  url: "{{url}}/api/v1/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "",
        "password": ""
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const accessToken = res.body.data.access_token;
        bru.setEnvVar("token", accessToken)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
